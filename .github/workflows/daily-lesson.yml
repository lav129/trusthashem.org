name: Daily Bitachon lesson check

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check podcast and YouTube for updates
        env:
          DAILY_LESSON_TO: bitachon@trusthashem.org
        run: node scripts/daily-lesson-check.mjs
      - name: Save lesson state
        run: |
          if git diff --quiet -- scripts/.daily-lesson-state.json; then
            echo "No state change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/.daily-lesson-state.json
            git commit -m "chore: update daily lesson check state"
            git push
          fi
